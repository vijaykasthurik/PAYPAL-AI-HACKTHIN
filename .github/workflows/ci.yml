name: PayBridge AI CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Test & Build (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: services/api/go.sum

      - name: Run Backend Unit & Chaos Tests
        working-directory: services/api
        run: |
          go test -v -race ./internal/...

      - name: Compile API & Worker Binaries
        working-directory: services/api
        run: |
          go build -v ./cmd/api
          go build -v ./cmd/worker

  frontend:
    name: Frontend Test & Build (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Typecheck & Build
        working-directory: apps/web
        run: npm run build

  golden-demo:
    name: Golden Demo B Verification
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Execute Golden Demo B Scenario
        run: bash scripts/demo-b.sh
